<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVG Stock Market</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --primary: #238636; --danger: #da3633; --accent: #1f6feb; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; user-select: none; }
        .hidden { display: none !important; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        
        /* Announcement Bar */
        #announcement-bar { background: var(--accent); color: white; padding: 10px; text-align: center; font-weight: bold; font-size: 14px; display: none; }
        
        .navbar { display: flex; justify-content: space-between; padding: 15px 25px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        input, select { background: #000; color: white; border: 1px solid var(--border); padding: 10px; margin: 5px 0; border-radius: 5px; width: calc(100% - 22px); }
        button { padding: 10px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary { background: #30363d; width: auto; margin: 0; }
        button.danger { background: var(--danger); }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
        .log-box { max-height: 150px; overflow-y: auto; background: #000; padding: 10px; font-family: monospace; font-size: 11px; border-radius: 5px; color: #8b949e; }
        #loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .status-tag { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .online { background: #23863633; color: #238636; border: 1px solid #238636; }
        .offline { background: #da363333; color: #da3633; border: 1px solid #da3633; }
        .rank-item { display: grid; grid-template-columns: 50px 1fr 150px; padding: 10px; border-bottom: 1px solid var(--border); align-items: center; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="announcement-bar"></div>
<div id="loading-overlay"><h2>🏛️ Please Wait...</h2></div>

<div id="view-login" class="container hidden">
    <div class="card" style="max-width: 400px; margin: auto; margin-top: 100px;">
        <h2 style="text-align: center;">BVG Stock Market</h2>
        <input type="text" id="user-login" placeholder="Username">
        <input type="password" id="pass-login" placeholder="Password">
        <button id="login-btn" onclick="handleLogin()">Sign In</button>
    </div>
</div>

<div id="view-main" class="hidden">
    <div class="navbar">
        <span id="nav-info"></span>
        <div>
            <button class="secondary" onclick="showView('view-market')">📈 Market</button>
            <button class="secondary" onclick="showView('view-portfolio')">💼 Portfolio</button>
            <button class="secondary" onclick="showView('view-leaderboard')">🏆 Ranks</button>
            <button id="admin-nav" class="secondary hidden" onclick="showView('view-admin')">⚙️ Admin</button>
            <button class="secondary" onclick="location.reload()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div id="view-market">
            <div style="display:flex; justify-content: space-between; align-items: center;">
                <h2>Live Tickers <span id="mkt-badge"></span></h2>
                <div>Qty: <input type="number" id="trade-qty" value="1" min="1" style="width: 60px; display: inline;"></div>
            </div>
            <div id="market-list" class="card"></div>
        </div>

        <div id="view-portfolio" class="hidden">
            <h2>Your Assets</h2>
            <div id="portfolio-list" class="card"></div>
        </div>

        <div id="view-leaderboard" class="hidden">
            <h2>Global Leaderboard</h2>
            <div class="card" id="leaderboard-list"></div>
        </div>

        <div id="view-admin" class="hidden">
            <h2>Admin Command Center</h2>
            
            <div class="card">
                <h3>📢 Global Announcement</h3>
                <input type="text" id="adm-msg" placeholder="Type a message for all users...">
                <div style="display:flex; gap:10px;">
                    <button onclick="adminSetMessage()">Post Message</button>
                    <button class="danger" onclick="adminClearMessage()">Clear</button>
                </div>
            </div>

            <div class="card">
                <h3>Transaction & Security Logs</h3>
                <div id="admin-logs" class="log-box"></div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="card">
                    <h3>User Control</h3>
                    <input type="text" id="adm-user-n" placeholder="Username">
                    <input type="text" id="adm-user-p" placeholder="New Password">
                    <input type="number" id="adm-user-b" placeholder="Set Budget">
                    <button onclick="adminUserAction('update')">Create/Update User</button>
                    <button class="danger" onclick="adminUserAction('disable')" style="margin-top:5px">Enable/Disable User</button>
                </div>
                <div class="card">
                    <h3>Stock Control</h3>
                    <input type="text" id="adm-stk-t" placeholder="Ticker">
                    <input type="number" id="adm-stk-p" placeholder="Price">
                    <button onclick="adminStockAction('update')">Create/Update Price</button>
                    <button class="danger" onclick="adminStockAction('delete')" style="margin-top:5px">Delete Ticker</button>
                </div>
            </div>
            
            <div class="card" style="border: 1px solid var(--danger);">
                <h3>System Danger Zone</h3>
                <div style="display:flex; gap:10px;">
                    <button class="danger" onclick="adminToggleSystem()" id="shutdown-btn">Shutdown Market</button>
                    <button class="danger" onclick="adminResetAll()">HARD RESET SYSTEM</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- SECURITY & LOGGING ---
    function disableMouseStuff() {
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("mousedown", e => {
    if (e.button === 1) e.preventDefault(); // middle click
  });
  document.addEventListener("dragstart", e => e.preventDefault());
}
    function reportSecurity(reason) {
        if (!currentUser) return;
        log(`[SECURITY] ${currentUser.username} ${reason}`);
        pushDB();
    }

    document.addEventListener("keydown", function(e){
    const forbidden = ["F12","I","J","C","U"];

    if (
        e.key === "F12" ||
        (e.ctrlKey && forbidden.includes(e.key.toUpperCase())) ||
        (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key.toUpperCase()))
    ) {
        e.preventDefault();
        reportSecurity("attempted DevTools shortcut");
    }
    if (e.key === "Enter") {
        if(currentUser === null) handleLogin();
      }
});

    // Detect if console is opened via window resizing
    let devtoolsOpen = false;
    const threshold = 160;
    disableMouseStuff();
    setInterval(() => {
        const widthThreshold = window.outerWidth - window.innerWidth > threshold;
        const heightThreshold = window.outerHeight - window.innerHeight > threshold;
        if (widthThreshold || heightThreshold) {
            if (!devtoolsOpen) {
                reportSecurity("opened DevTools window");
                devtoolsOpen = true;
            }
        } else { devtoolsOpen = false; }
    }, 2000);
/* =========================
   CONFIG
========================= */

    const p1 = "g";
    const p2 = "hp_bbqU";
    const p3 = "e5K7A60oh";
    const p4 = "iruHcbyp4s0zy65Z";
    const p5 "t0iHYJ4";
const GITHUB_CONFIG = {
    token: p1 + p2 + p3 + p4 + p5,
    repo: "Alalani-school/stock-market-database",
    path: "db.json",
    branch: "main"
};

let DB = null;
let currentUser = null;
let currentSha = null;
let isBusy = false;

/* =========================
   INIT
========================= */

window.onload = async () => {
    const ok = await syncDB();
    if (!ok) {
        alert("Database failed to load. Check console.");
        return;
    }

    document.getElementById("loading-overlay").classList.add("hidden");
    document.getElementById("view-login").classList.remove("hidden");
};

/* =========================
   DATABASE SYNC
========================= */

async function syncDB() {
    try {
        const res = await fetch(
            `https://api.github.com/repos/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}?ref=${GITHUB_CONFIG.branch}`,
            {
                headers: {
                    Authorization: `Bearer ${GITHUB_CONFIG.token}`
                }
            }
        );

        if (!res.ok) {
            console.error("SYNC FAILED:", res.status);
            return false;
        }

        const data = await res.json();
        currentSha = data.sha;

        DB = JSON.parse(atob(data.content));

        return true;

    } catch (err) {
        console.error("SYNC ERROR:", err);
        return false;
    }
}

/* =========================
   DATABASE PUSH
========================= */

async function pushDB() {
    if (isBusy) return;
    isBusy = true;

    try {
        // Always get latest SHA before pushing
        const synced = await syncDB();
        if (!synced) {
            alert("Failed to refresh database before saving.");
            return;
        }

        const content = btoa(JSON.stringify(DB, null, 2));

        const res = await fetch(
            `https://api.github.com/repos/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`,
            {
                method: "PUT",
                headers: {
                    Authorization: `Bearer ${GITHUB_CONFIG.token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: "Update via stock market app",
                    content: content,
                    sha: currentSha,
                    branch: GITHUB_CONFIG.branch
                })
            }
        );

        if (res.status === 409) {
            console.warn("SHA conflict. Please try again.");
            return;
        }

        if (!res.ok) {
            console.error("PUSH FAILED:", res.status);
            return;
        }

        await syncDB();

    } catch (err) {
        console.error("PUSH ERROR:", err);
    } finally {
        isBusy = false;
    }
}

/* =========================
   LOGIN
========================= */

async function handleLogin() {
    if (!DB) {
        alert("Database not loaded.");
        return;
    }

    const username = document.getElementById("user-login").value;
    const password = document.getElementById("pass-login").value;

    const found = DB.users.find(
        u => u.username === username && u.password === password
    );

    if (!found) {
        alert("Invalid Login");
        return;
    }

    if (found.disabled && found.role !== "admin") {
        alert("Account Disabled.");
        return;
    }

    currentUser = found;

    document.getElementById("view-login").classList.add("hidden");
    document.getElementById("view-main").classList.remove("hidden");

    if (found.role === "admin") {
        document.getElementById("admin-nav").classList.remove("hidden");
    }

    renderUI();
}

/* =========================
   UI
========================= */

function renderUI() {
    if (!DB || !currentUser) return;

    document.getElementById("nav-info").innerText =
        `👤 ${currentUser.username} | 💰 $${currentUser.balance.toLocaleString()}`;

    const badge = document.getElementById("mkt-badge");
    badge.innerText = DB.systemLive ? "ONLINE" : "OFFLINE";
    badge.className = "status-tag " + (DB.systemLive ? "online" : "offline");

    document.getElementById("shutdown-btn").innerText =
        DB.systemLive ? "Shutdown Market" : "Enable Market";

    const disabled =
        isBusy || (!DB.systemLive && currentUser.role !== "admin")
            ? "disabled"
            : "";

    // Market
    document.getElementById("market-list").innerHTML = DB.stocks.map(s => `
        <div class="item-row">
            <span><b>${s.ticker}</b>: $${s.price.toLocaleString()}</span>
            <div>
                <button ${disabled} onclick="trade('${s.ticker}','buy')">Buy</button>
                <button ${disabled} onclick="trade('${s.ticker}','sell')" class="danger">Sell</button>
            </div>
        </div>
    `).join("");

    // Leaderboard
    const sorted = [...DB.users].sort((a,b) => b.balance - a.balance);
    document.getElementById("leaderboard-list").innerHTML =
        sorted.map((u,i) => `
            <div class="rank-item">
                <span>#${i+1}</span>
                <span>${u.username}</span>
                <span style="text-align:right">$${u.balance.toLocaleString()}</span>
            </div>
        `).join("");
}

/* =========================
   TRADING
========================= */

async function trade(ticker, type) {
    if (isBusy) return;

    const qty = parseInt(document.getElementById("trade-qty").value) || 1;
    const stock = DB.stocks.find(s => s.ticker === ticker);
    const user = DB.users.find(u => u.username === currentUser.username);

    const total = stock.price * qty;

    if (type === "buy") {
        if (user.balance < total) {
            alert("Not enough funds.");
            return;
        }
        user.balance -= total;
        user.portfolio[ticker] = (user.portfolio[ticker] || 0) + qty;
    }

    if (type === "sell") {
        if ((user.portfolio[ticker] || 0) < qty) {
            alert("Not enough shares.");
            return;
        }
        user.balance += total;
        user.portfolio[ticker] -= qty;
    }

    await pushDB();
    renderUI();
}

/* =========================
   ADMIN
========================= */

async function adminToggleSystem() {
    if (currentUser.role !== "admin") return;
    DB.systemLive = !DB.systemLive;
    await pushDB();
    renderUI();
}

async function adminResetAll() {
    if (currentUser.role !== "admin") return;
    if (!confirm("HARD RESET SYSTEM?")) return;

    DB.users.forEach(u => {
        u.balance = 1000;
        u.portfolio = {};
    });

    await pushDB();
    renderUI();
}

function showView(id) {
    ["view-market","view-portfolio","view-leaderboard","view-admin"]
        .forEach(v => document.getElementById(v).classList.add("hidden"));

    document.getElementById(id).classList.remove("hidden");
}
</script>
</body>
</html>
