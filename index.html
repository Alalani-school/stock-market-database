<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Exchange Pro</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --primary: #238636; --danger: #da3633; --accent: #1f6feb; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        .hidden { display: none !important; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .navbar { display: flex; justify-content: space-between; padding: 15px 25px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        input, select { background: #000; color: white; border: 1px solid var(--border); padding: 10px; margin: 5px 0; border-radius: 5px; width: calc(100% - 22px); }
        button { padding: 10px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary { background: #30363d; width: auto; margin: 0; }
        button.sell { background: var(--danger); width: auto; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
        #loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .log-entry { font-size: 12px; font-family: monospace; padding: 5px; border-bottom: 1px solid #222; color: #8b949e; }
    </style>
</head>
<body>

<div id="loading-overlay"><h2>🏛️ Connecting to Exchange...</h2><p id="load-status">Checking credentials...</p></div>

<div id="view-login" class="container hidden">
    <div class="card" style="max-width: 400px; margin: auto;">
        <h2 style="text-align: center;">Exchange Login</h2>
        <div id="setup-section">
            <input type="password" id="gh-token" placeholder="GitHub Token">
            <input type="text" id="gh-repo" placeholder="username/repo">
            <button onclick="testConnection()" style="background: var(--accent);">Save & Connect</button>
        </div>
        <div id="login-section" class="hidden">
            <input type="text" id="user-login" placeholder="Username">
            <input type="password" id="pass-login" placeholder="Password">
            <button onclick="handleLogin()">Sign In</button>
            <button onclick="clearStorage()" class="secondary" style="width:100%; margin-top:10px;">Reset Connection</button>
        </div>
    </div>
</div>

<div id="view-main" class="hidden">
    <div class="navbar">
        <span id="nav-info"></span>
        <div>
            <button class="secondary" onclick="showView('view-market')">📈 Market</button>
            <button class="secondary" onclick="showView('view-portfolio')">💼 Portfolio</button>
            <button id="admin-nav" class="secondary hidden" onclick="showView('view-admin')">⚙️ Admin</button>
            <button class="secondary" onclick="location.reload()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div id="view-market">
            <div style="display:flex; justify-content: space-between; align-items: center;">
                <h2>Live Market</h2>
                <div>Qty: <input type="number" id="trade-qty" value="1" min="1" style="width: 50px; display: inline;"></div>
            </div>
            <div id="market-list" class="card"></div>
        </div>

        <div id="view-portfolio" class="hidden">
            <h2>Your Assets</h2>
            <div id="portfolio-list" class="card"></div>
        </div>

        <div id="view-admin" class="hidden">
            <h2>Admin Control Panel</h2>
            <div class="card">
                <h3>Transaction Logs</h3>
                <div id="admin-logs" style="max-height: 200px; overflow-y: auto; background: #000; padding: 10px; border-radius: 5px;"></div>
            </div>
            <div class="card">
                <h3>User & Stock Management</h3>
                <input type="text" id="adm-name" placeholder="Name / Ticker">
                <input type="number" id="adm-val" placeholder="Budget / Price">
                <div style="display:flex; gap:10px;">
                    <button onclick="adminAction('user')">Update User</button>
                    <button onclick="adminAction('stock')">Update Stock</button>
                </div>
            </div>
            <button class="sell" style="width:100%" onclick="adminToggle()">Toggle Shutdown</button>
        </div>
    </div>
</div>

<script>
    let DB = null, currentUser = null, currentSha = "", isBusy = false;
    let GITHUB_CONFIG = { token: "", repo: "", path: "db.json" };

    window.onload = async () => {
        const t = localStorage.getItem('exch_token'), r = localStorage.getItem('exch_repo');
        if (t && r) {
            GITHUB_CONFIG.token = t; GITHUB_CONFIG.repo = r;
            if (await syncDB()) {
                document.getElementById('setup-section').classList.add('hidden');
                document.getElementById('login-section').classList.remove('hidden');
            }
        }
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('view-login').classList.remove('hidden');
    };

    async function syncDB() {
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`, {
                headers: { "Authorization": `Bearer ${GITHUB_CONFIG.token}` }
            });
            if (!res.ok) return false;
            const data = await res.json();
            currentSha = data.sha;
            DB = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, '')))));
            if (currentUser) currentUser = DB.users.find(u => u.username === currentUser.username);
            return true;
        } catch (e) { return false; }
    }

    async function pushDB(retryCount = 3) {
        isBusy = true; renderUI();
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(DB, null, 2))));
        const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`, {
            method: "PUT",
            headers: { "Authorization": `Bearer ${GITHUB_CONFIG.token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: `Trade by ${currentUser?.username || 'Admin'}`, content, sha: currentSha })
        });

        if (res.status === 409 && retryCount > 0) {
            console.warn("Conflict detected. Retrying...");
            await syncDB();
            return await pushDB(retryCount - 1);
        }
        
        isBusy = false;
        if (res.ok) { await syncDB(); renderUI(); } 
        else { alert("Database Busy. Try again."); }
    }

    async function handleLogin() {
        await syncDB();
        const u = document.getElementById('user-login').value, p = document.getElementById('pass-login').value;
        const found = DB.users.find(x => x.username === u && x.password === p);
        if (found) {
            currentUser = found;
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-main').classList.remove('hidden');
            if (found.role === 'admin') document.getElementById('admin-nav').classList.remove('hidden');
            renderUI();
        } else alert("Fail");
    }

    function renderUI() {
        if (!currentUser) return;
        document.getElementById('nav-info').innerText = `💰 $${currentUser.balance.toLocaleString()}`;
        const btnState = isBusy ? "disabled" : "";

        // Market
        document.getElementById('market-list').innerHTML = DB.stocks.map(s => `
            <div class="item-row">
                <span><b>${s.ticker}</b>: $${s.price}</span>
                <div>
                    <button class="secondary" ${btnState} onclick="trade('${s.ticker}','buy')">Buy</button>
                    <button class="secondary sell" ${btnState} onclick="trade('${s.ticker}','sell')">Sell</button>
                </div>
            </div>`).join('');

        // Portfolio
        const port = currentUser.portfolio || {};
        document.getElementById('portfolio-list').innerHTML = Object.entries(port).filter(([_,q]) => q > 0)
            .map(([t,q]) => `<div class="item-row"><b>${t}</b> <span>${q} Shares</span></div>`).join('') || "Empty";

        // Admin Logs
        if (currentUser.role === 'admin') {
            document.getElementById('admin-logs').innerHTML = (DB.logs || []).slice().reverse()
                .map(l => `<div class="log-entry">[${l.time}] ${l.msg}</div>`).join('');
        }
    }

    async function trade(ticker, type) {
        if (!DB.systemLive && currentUser.role !== 'admin') return alert("Closed");
        await syncDB();
        const qty = parseInt(document.getElementById('trade-qty').value) || 1;
        const stock = DB.stocks.find(s => s.ticker === ticker);
        const user = DB.users.find(u => u.username === currentUser.username);
        const total = stock.price * qty;

        if (type === 'buy' && user.balance >= total) {
            user.balance -= total;
            user.portfolio[ticker] = (user.portfolio[ticker] || 0) + qty;
            log(`${user.username} bought ${qty} ${ticker} for $${total}`);
        } else if (type === 'sell' && (user.portfolio[ticker] || 0) >= qty) {
            user.balance += total;
            user.portfolio[ticker] -= qty;
            log(`${user.username} sold ${qty} ${ticker} for $${total}`);
        } else { return alert("Invalid trade"); }
        await pushDB();
    }

    function log(msg) {
        const time = new Date().toLocaleTimeString();
        if (!DB.logs) DB.logs = [];
        DB.logs.push({ time, msg });
        if (DB.logs.length > 50) DB.logs.shift();
    }

    // --- ADMIN ACTIONS ---
    async function adminAction(type) {
        const n = document.getElementById('adm-name').value, v = parseFloat(document.getElementById('adm-val').value);
        if (type === 'user') {
            let u = DB.users.find(x => x.username === n);
            if (u) u.balance = v;
            else DB.users.push({username:n, password:"123", balance:v, role:"user", portfolio:{}});
        } else {
            let s = DB.stocks.find(x => x.ticker === n.toUpperCase());
            s ? s.price = v : DB.stocks.push({ticker:n.toUpperCase(), price:v});
        }
        await pushDB();
    }

    async function adminToggle() { DB.systemLive = !DB.systemLive; await pushDB(); }
    function showView(id) {
        ['view-market', 'view-portfolio', 'view-admin'].forEach(v => document.getElementById(v).classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        renderUI();
    }
    function testConnection() {
        GITHUB_CONFIG.token = document.getElementById('gh-token').value;
        GITHUB_CONFIG.repo = document.getElementById('gh-repo').value;
        localStorage.setItem('exch_token', GITHUB_CONFIG.token);
        localStorage.setItem('exch_repo', GITHUB_CONFIG.repo);
        location.reload();
    }
    function clearStorage() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
